<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Угадай ЖК Краснодара</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#081225;
color:white;
text-align:center;
min-height:100vh;
}

header{
padding:25px 20px;
border-bottom:2px solid #d4af37;
background:#0b172d;
}

h1{
font-size:42px;
color:#d4af37;
margin-bottom:10px;
}

.subtitle{
color:#cbd5e1;
font-size:18px;
line-height:1.5;
}

.scoreboard{
display:flex;
justify-content:center;
gap:30px;
margin-top:25px;
flex-wrap:wrap;
}

.team{
background:#13203a;
border:2px solid #d4af37;
padding:15px 30px;
border-radius:16px;
font-size:22px;
font-weight:bold;
min-width:220px;
}

.turn{
margin-top:20px;
font-size:26px;
color:#ffd700;
font-weight:bold;
}

.game-container{
padding:30px 20px 50px;
}

.image-wrapper{
position:relative;
width:900px;
max-width:95%;
height:560px;
margin:auto;
overflow:hidden;
border-radius:24px;
border:4px solid #d4af37;
box-shadow:0 0 25px rgba(212,175,55,0.35);
background:#111;
}

.image-wrapper img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

.grid{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
display:grid;
grid-template-columns:repeat(4,1fr);
grid-template-rows:repeat(4,1fr);
}

.tile{
background:#0b172d;
border:1px solid #13203a;
cursor:pointer;
transition:0.3s;
}

.tile:hover{
background:#1b2b4b;
}

.tile.hidden{
opacity:0;
pointer-events:none;
}

.controls{
margin-top:35px;
display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;
}

input{
padding:16px;
width:320px;
border:none;
border-radius:12px;
font-size:18px;
outline:none;
background:white;
}

button{
padding:16px 24px;
border:none;
border-radius:12px;
background:#d4af37;
color:black;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.04);
}

.info{
margin-top:25px;
font-size:20px;
color:#cbd5e1;
}

.footer{
padding:30px 20px;
color:#94a3b8;
font-size:15px;
line-height:1.6;
}

@media(max-width:768px){

h1{
font-size:28px;
}

.image-wrapper{
height:350px;
}

.team{
font-size:18px;
padding:12px 18px;
min-width:160px;
}

.turn{
font-size:22px;
}

input{
width:90%;
}

}

</style>
</head>

<body>

<header>

<h1>🏙 УГАДАЙ ЖК КРАСНОДАРА</h1>

<div class="subtitle">
Интерактивный тренажёр по новостройкам<br>
24 офис АЯКС • Разработано амбассадором 24 офиса
</div>

<div class="scoreboard">

<div class="team">
🔴 Команда 1:
<span id="score1">0</span>
</div>

<div class="team">
🔵 Команда 2:
<span id="score2">0</span>
</div>

</div>

<div class="turn" id="turn">
Ход: Команда 1
</div>

</header>

<div class="game-container">

<div class="image-wrapper">

<img id="zhkImage" src="images/samolet.jpg">

<div class="grid" id="grid"></div>

</div>

<div class="controls">

<input
type="text"
id="answerInput"
placeholder="Введите название ЖК"
/>

<button onclick="checkAnswer()">
Ответить
</button>

<button onclick="nextRound()">
Следующий ЖК
</button>

</div>

<div class="info">
🎯 Чем меньше открыто квадратов — тем больше очков
</div>

</div>

<div class="footer">
© Игровой инструмент 24 офиса АЯКС
</div>

<script>

const zhkList = [

{
name:"Народные кварталы",
image:"images/narodnie.png"
},

{
name:"Югге",
image:"images/hugge.webp"
},

{
name:"Архитектор",
image:"images/arhitektor.jpg"
},

{
name:"Иначе",
image:"images/inache.jpg"
},

{
name:"Самолет",
image:"images/samolet.jpg"
},

{
name:"Образцово",
image:"images/obrazcovo.jpg"
},

{
name:"Форма",
image:"images/forma.jpeg"
},

{
name:"Парк Победы 2",
image:"images/park-pobedy2.jpg"
},

{
name:"Дом 101",
image:"images/dom101.jpeg"
},

{
name:"Коллекция",
image:"images/collekcia.jpg"
}

];

let currentIndex = 0;
let currentTeam = 1;

let scores = {
1:0,
2:0
};

const image = document.getElementById("zhkImage");
const grid = document.getElementById("grid");

function createGrid(){

grid.innerHTML = "";

for(let i=0;i<16;i++){

const tile = document.createElement("div");

tile.classList.add("tile");

tile.addEventListener("click", ()=>{

tile.classList.add("hidden");

});

grid.appendChild(tile);

}

}

function checkAnswer(){

const input = document.getElementById("answerInput");

const value = input.value.trim().toLowerCase();

const correct = zhkList[currentIndex].name.toLowerCase();

const opened = document.querySelectorAll(".tile.hidden").length;

let points = 100 - opened * 5;

if(points < 20){
points = 20;
}

if(value === correct){

scores[currentTeam] += points;

document.getElementById("score1").innerText = scores[1];
document.getElementById("score2").innerText = scores[2];

alert("✅ Правильно! +" + points + " очков");

nextRound();

}else{

alert("❌ Неверно! Ход переходит другой команде");

currentTeam = currentTeam === 1 ? 2 : 1;

document.getElementById("turn").innerText =
"Ход: Команда " + currentTeam;

}

input.value = "";

}

function nextRound(){

currentIndex++;

if(currentIndex >= zhkList.length){

alert("🏆 Игра окончена!");

currentIndex = 0;

scores[1] = 0;
scores[2] = 0;

document.getElementById("score1").innerText = 0;
document.getElementById("score2").innerText = 0;

}

image.src = zhkList[currentIndex].image;

createGrid();

}

createGrid();

</script>

</body>
</html>
