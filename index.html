<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Угадай ЖК Краснодара</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0f172a;
    color:white;
    text-align:center;
}

header{
    padding:20px;
    background:#111827;
    border-bottom:2px solid gold;
}

h1{
    color:gold;
    margin:0;
}

.subtitle{
    color:#cbd5e1;
    margin-top:10px;
}

.scoreboard{
    display:flex;
    justify-content:center;
    gap:40px;
    margin-top:20px;
    font-size:22px;
}

.team{
    background:#1e293b;
    padding:15px 30px;
    border-radius:12px;
    border:1px solid gold;
}

.game-container{
    margin-top:30px;
}

.image-wrapper{
    position:relative;
    width:600px;
    height:400px;
    margin:auto;
    border:3px solid gold;
    overflow:hidden;
    border-radius:20px;
}

.image-wrapper img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.grid{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    grid-template-rows:repeat(4,1fr);
}

.tile{
    background:#111827;
    border:1px solid #0f172a;
    cursor:pointer;
}

.tile.hidden{
    opacity:0;
    pointer-events:none;
}

.controls{
    margin-top:30px;
}

input{
    padding:12px;
    width:300px;
    border-radius:10px;
    border:none;
    font-size:18px;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:10px;
    background:gold;
    color:black;
    font-size:18px;
    cursor:pointer;
    margin-left:10px;
    font-weight:bold;
}

button:hover{
    opacity:0.9;
}

.current-turn{
    margin-top:20px;
    font-size:22px;
    color:gold;
}

.footer{
    margin-top:40px;
    padding-bottom:30px;
    color:#94a3b8;
}

</style>
</head>

<body>

<header>
<h1>🏙 УГАДАЙ ЖК КРАСНОДАРА</h1>

<div class="subtitle">
Интерактивный тренажёр по новостройкам<br>
24 офис АЯКС • Амбассадор 24 офиса
</div>

<div class="scoreboard">
<div class="team" id="team1">
🔴 Команда 1: <span id="score1">0</span>
</div>

<div class="team" id="team2">
🔵 Команда 2: <span id="score2">0</span>
</div>
</div>

<div class="current-turn" id="turn">
Ход: Команда 1
</div>
</header>

<div class="game-container">

<div class="image-wrapper">

<img id="zhkImage" src="https://images.unsplash.com/photo-1460317442991-0ec209397118?q=80&w=1200&auto=format&fit=crop" />

<div class="grid" id="grid"></div>

</div>

<div class="controls">

<input type="text" id="answerInput" placeholder="Введите название ЖК">

<button onclick="checkAnswer()">Ответить</button>

<button onclick="nextRound()">Следующий ЖК</button>

</div>

</div>

<div class="footer">
© Игровой инструмент 24 офиса АЯКС
</div>

<script>

const zhkList = [
{
name:"Самолет",
image:"https://images.unsplash.com/photo-1460317442991-0ec209397118?q=80&w=1200&auto=format&fit=crop"
},
{
name:"Форма",
image:"https://images.unsplash.com/photo-1511818966892-d7d671e672a2?q=80&w=1200&auto=format&fit=crop"
},
{
name:"Коллекция",
image:"https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=1200&auto=format&fit=crop"
}
];

let currentIndex = 0;
let currentTeam = 1;

let scores = {
1:0,
2:0
};

const image = document.getElementById("zhkImage");
const grid = document.getElementById("grid");

function createGrid(){

grid.innerHTML = "";

for(let i=0;i<16;i++){

const tile = document.createElement("div");

tile.classList.add("tile");

tile.addEventListener("click", ()=>{

tile.classList.add("hidden");

});

grid.appendChild(tile);

}

}

function checkAnswer(){

const input = document.getElementById("answerInput");

const value = input.value.trim().toLowerCase();

const correct = zhkList[currentIndex].name.toLowerCase();

const opened = document.querySelectorAll(".tile.hidden").length;

let points = 100 - opened * 5;

if(points < 20) points = 20;

if(value === correct){

scores[currentTeam]+=points;

document.getElementById("score1").innerText = scores[1];
document.getElementById("score2").innerText = scores[2];

alert("✅ Правильно! +" + points + " очков");

nextRound();

}else{

alert("❌ Неверно! Ход переходит другой команде");

currentTeam = currentTeam === 1 ? 2 : 1;

document.getElementById("turn").innerText =
"Ход: Команда " + currentTeam;

}

input.value = "";

}

function nextRound(){

currentIndex++;

if(currentIndex >= zhkList.length){

alert("🎉 Игра окончена!");

currentIndex = 0;

scores[1]=0;
scores[2]=0;

document.getElementById("score1").innerText = 0;
document.getElementById("score2").innerText = 0;

}

image.src = zhkList[currentIndex].image;

createGrid();

}

createGrid();

</script>

</body>
</html>
